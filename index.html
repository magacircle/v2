<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MagaCircle™ — Building the Parallel Economy</title>
<meta name="description" content="MagaCircle™ — Building the Parallel Economy. Take the Builder Profile quiz to see if you qualify.">
<style>
:root{--gold:#a99463;--text:#eeeae0;--muted:#b0aca2;--black:#070809}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,5,7,.42),rgba(3,5,7,.20) 45%,rgba(0,0,0,.66) 100%)}
.content{position:relative;z-index:2;width:min(720px,90vw);text-align:center;padding:42px 0 54px;display:flex;flex-direction:column;align-items:center}
.logo{width:min(270px,62vw);height:auto;margin:0 auto 18px;filter:brightness(.92);opacity:.92}
.tagline{font-size:11px;letter-spacing:.28em;color:#d4d0c5;text-transform:uppercase;margin-bottom:48px}
h1{font-size:clamp(42px,7vw,76px);line-height:1.02;letter-spacing:-.035em;margin:0;font-weight:700;color:#f2efe8;text-shadow:0 2px 20px rgba(0,0,0,.25)}
h1 span{display:block;margin-top:7px;color:var(--gold)}
.sub{margin:30px 0 24px;font-size:16px;line-height:1.55;color:#e0ddd5}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:13px;min-width:245px;padding:17px 25px;border:1px solid var(--gold);border-radius:4px;background:rgba(4,5,6,.72);color:var(--gold);text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 12px 35px rgba(0,0,0,.28);transition:.2s}
.cta:hover{background:rgba(169,148,99,.10);transform:translateY(-1px)}
.bottom{margin-top:64px;font-size:10px;letter-spacing:.18em;color:rgba(235,232,224,.66);text-transform:uppercase}
@media(max-width:600px){.content{padding-top:34px}.logo{width:min(225px,64vw);margin-bottom:15px}.tagline{font-size:9px;letter-spacing:.22em;margin-bottom:40px}h1{font-size:clamp(39px,12vw,58px)}.sub{font-size:14px;margin-top:25px}.cta{width:min(290px,82vw)}.bottom{margin-top:48px;font-size:8px}}
</style>
</head>
<body>
<main class="hero">
<img class="hero-bg" src="assets/landing-hero.png" alt="Cinematic sunrise landscape with a group of people overlooking the horizon">
<div class="content">
<img class="logo" src="assets/MagaCircle_logo_transparent.png" alt="MagaCircle™">
<div class="tagline">BUILDING THE PARALLEL ECONOMY</div>
<h1>What would you do<span>with $50K?</span></h1>
<p class="sub">Take the quiz to see if you qualify for MagaCircle™</p>
<a class="cta" href="quiz.html">LET’S BEGIN <span aria-hidden="true">→</span></a>
<div class="bottom">The first circle is forming.</div>
</div>
</main>
</body>
</html>
