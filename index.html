<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagaCircle™</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/MagaCircle_logo_transparent.png">

  <style>
    /* ==========================================================================
       1. GLOBAL RESET
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #060a14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Outer wrapper ensuring dead-center alignment on all screen sizes */
    .page-wrapper {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin: 0 auto;
    }

    /* ==========================================================================
       2. MOBILE / PORTRAIT LAYOUT (Phones & Vertical Tablets)
       Fills phone screen width naturally, centered, scrolls smoothly to footer.
       ========================================================================== */
    .hero-container {
      position: relative;
      width: 100%;
      max-width: 480px; /* Standard phone width limit; perfectly centered */
      margin: 0 auto;
      line-height: 0;
    }

    .hero-link {
      display: block;
      position: relative;
      width: 100%;
      text-decoration: none;
      cursor: pointer;
    }

    /* Mobile image: fits 100% of phone width, natural height, zero dead margins */
    .hero-img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Mobile CTA hotspot directly over the 'JOIN THE CIRCLE' button area */
    .cta-hotspot {
      position: absolute;
      top: 67%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76%;
      height: 7%;
      border-radius: 50px;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      outline: none;
    }

    /* ==========================================================================
       3. DESKTOP / LAPTOP LANDSCAPE LAYOUT (min-width: 769px & landscape)
       True widescreen landscape with panoramic scenery extending edge-to-edge.
       No phone card, no boxy edges, seamless blending.
       ========================================================================== */
    @media (min-width: 769px) and (orientation: landscape) {
      .page-wrapper {
        justify-content: space-between;
        /* Panoramic scenery spans the entire widescreen monitor */
        background: url('assets/landing-scenery.png') center top / cover no-repeat;
        background-color: #060a14;
      }

      .hero-container {
        max-width: 100%;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 10px;
      }

      .hero-link {
        width: auto;
        display: inline-block;
      }

      .hero-img {
        width: auto;
        max-width: 90vw;
        max-height: 84vh; /* Leaves bottom circle and tagline safe and visible */
        object-fit: contain;
        /* Soft horizontal mask so portrait edges blend invisibly into the scenery */
        -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      }

      .cta-hotspot {
        top: 67%;
        width: 65%;
        height: 7%;
      }
    }

    /* ==========================================================================
       4. FOOTER (Exact links restored, clean copyright, no unsolicited text)
       ========================================================================== */
    .site-footer {
      width: 100%;
      text-align: center;
      padding: 24px 16px 28px;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.04em;
      z-index: 20;
    }

    .footer-links {
      margin-bottom: 8px;
    }

    .footer-links a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      margin: 0 10px;
      transition: color 0.15s ease;
    }

    .footer-links a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .footer-links .sep {
      color: rgba(255, 255, 255, 0.35);
      user-select: none;
    }

    .copyright {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.76rem;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <main class="hero-container">
      <a href="quiz.html" class="hero-link" aria-label="Join MagaCircle">
        <picture>
          <!-- Mobile / Portrait artwork -->
          <source media="(max-width: 768px)" srcset="assets/landing-hero.png">
          <source media="(orientation: portrait)" srcset="assets/landing-hero.png">

          <!-- Desktop Fallback Image -->
          <img 
            src="assets/landing-hero.png" 
            alt="MagaCircle™" 
            class="hero-img"
            loading="eager"
            onerror="this.onerror=null; this.src='assets/landing-approved-mockup.png';">
        </picture>

        <!-- Tap target over the CTA button -->
        <span class="cta-hotspot" role="button" aria-label="Take the Quiz"></span>
      </a>
    </main>

    <!-- Footer with Quiz link restored and original copyright -->
    <footer class="site-footer">
      <div class="footer-links">
        <a href="quiz.html">Quiz</a>
        <span class="sep">&bull;</span>
        <a href="privacy.html">Privacy Policy</a>
        <span class="sep">&bull;</span>
        <a href="terms.html">Terms</a>
      </div>
      <p class="copyright">&copy; 2025 MagaCircle™</p>
    </footer>
  </div>

</body>
</html>
