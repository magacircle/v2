<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MagaCircle™</title>
  <meta name="description" content="The First Circle is Forming. Join MagaCircle™ today.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/MagaCircle_logo_transparent.png">

  <style>
    /* ==========================================================================
       1. GLOBAL RESET & BASE STYLES
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      background-color: #080e1b; /* Seamless deep navy matching the artwork sky */
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Outer stage that guarantees dead-center alignment on all screens */
    .viewport-container {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 10px) env(safe-area-inset-right, 10px) env(safe-area-inset-bottom, 12px) env(safe-area-inset-left, 10px);
    }

    /* ==========================================================================
       2. HERO ARTWORK CONTAINER
       ========================================================================== */
    .hero-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      flex: 1 1 auto;
      margin: 0 auto;
    }

    .hero-stage {
      position: relative;
      display: inline-block;
      max-width: 100%;
      line-height: 0; /* Prevents inline gap underneath image */
    }

    /* Image sizing: perfectly contained, never cropped, never distorted */
    .hero-image {
      display: block;
      width: auto;
      height: auto;
      max-width: 96vw;
      max-height: 86dvh;
      object-fit: contain;
      margin: 0 auto;
      border-radius: 4px;
      user-select: none;
      -webkit-user-drag: none;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }

    /* ==========================================================================
       3. INTERACTIVE CTA HOTSPOT & OVERLAYS
       ========================================================================== */
    /* Mobile / Portrait CTA hotspot coordinates */
    .cta-hotspot {
      position: absolute;
      top: 67%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 74%;
      height: 7.5%;
      border-radius: 50px;
      display: block;
      z-index: 10;
      text-decoration: none;
      background: transparent;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-hotspot:hover,
    .cta-hotspot:focus-visible {
      transform: translate(-50%, -50%) scale(1.02);
      box-shadow: 0 0 25px rgba(230, 57, 70, 0.65);
    }

    /* Entire artwork is also clickable directly to the quiz */
    .artwork-link {
      display: inline-block;
      text-decoration: none;
      position: relative;
      cursor: pointer;
    }

    /* ==========================================================================
       4. FOOTER & LEGAL LINKS
       ========================================================================== */
    .site-footer {
      width: 100%;
      text-align: center;
      padding: 12px 16px 8px;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.05em;
      flex-shrink: 0;
      z-index: 20;
    }

    .site-footer a {
      color: rgba(255, 255, 255, 0.75);
      text-decoration: none;
      margin: 0 10px;
      transition: color 0.2s ease;
    }

    .site-footer a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .site-footer .divider {
      color: rgba(255, 255, 255, 0.3);
    }

    /* ==========================================================================
       5. RESPONSIVE BREAKPOINTS (TABLETS & DESKTOP LANDSCAPE)
       ========================================================================== */

    /* For laptops, desktop monitors & landscape tablets */
    @media (orientation: landscape) and (min-width: 768px) {
      .viewport-container {
        padding: 12px 24px;
        justify-content: center;
      }

      .hero-image {
        max-width: 95vw;
        max-height: 85dvh;
      }

      /* Re-calibrated hotspot for the 16:9 desktop landscape asset */
      .cta-hotspot {
        top: 66.5%;
        left: 50%;
        width: 28%;
        height: 8%;
      }
    }

    /* Very short vertical screens (e.g. laptop with URL bar/dev tools open) */
    @media (max-height: 650px) and (orientation: landscape) {
      .hero-image {
        max-height: 80dvh;
      }
      .site-footer {
        padding: 4px 16px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <main class="viewport-container">
    <div class="hero-wrapper">
      <div class="hero-stage">
        <!-- Whole hero links to quiz.html for effortless tapping/clicking -->
        <a href="quiz.html" class="artwork-link" aria-label="Join MagaCircle - The First Circle is Forming">
          <picture>
            <!-- 1. Landscape Laptops & Desktops: loads dedicated landscape composition -->
            <source 
              media="(orientation: landscape) and (min-width: 768px)" 
              srcset="assets/landing-desktop-landscape.png">
            
            <!-- Fallback for other wide ratios if desktop-landscape is not available -->
            <source 
              media="(orientation: landscape) and (min-width: 768px)" 
              srcset="assets/landing-landscape.png">

            <!-- 2. Mobile phones & Portrait tablets: loads original approved portrait design -->
            <source 
              media="(orientation: portrait)" 
              srcset="assets/landing-hero.png">

            <!-- Default Image Fallback -->
            <img 
              src="assets/landing-hero.png" 
              alt="MagaCircle™ - The First Circle is Forming" 
              class="hero-image"
              loading="eager"
              onerror="this.onerror=null; this.src='assets/landing-approved-mockup.png';">
          </picture>

          <!-- Hotspot directly over the 'JOIN THE CIRCLE' button -->
          <span class="cta-hotspot" role="button" aria-label="Join the Circle"></span>
        </a>
      </div>
    </div>

    <!-- Legal and Safe Area Footer -->
    <footer class="site-footer">
      <p>
        &copy; <span id="current-year"></span> MagaCircle™. All rights reserved.
        <span class="divider">|</span>
        <a href="privacy.html">Privacy Policy</a>
        <span class="divider">|</span>
        <a href="terms.html">Terms of Service</a>
      </p>
    </footer>
  </main>

  <script>
    // Keep copyright year current automatically
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
