<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MagaCircle™</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/MagaCircle_logo_transparent.png">

  <style>
    /* ==========================================================================
       1. GLOBAL RESET & BASE
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #060a14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==========================================================================
       2. MOBILE PORTRAIT LAYOUT (< 769px)
       Fits screen cleanly, footer visible, ZERO scroll into empty black space.
       ========================================================================== */
    @media (max-width: 768px) {
      body {
        height: 100dvh;
        overflow: hidden; /* Eliminates trailing black scroll entirely */
      }

      .mobile-view {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        height: 100dvh;
        max-width: 480px;
        margin: 0 auto;
        padding: env(safe-area-inset-top, 6px) 0 env(safe-area-inset-bottom, 8px);
      }

      .desktop-view {
        display: none !important;
      }

      .mobile-hero-stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
      }

      .mobile-artwork-link {
        position: relative;
        display: inline-block;
        max-height: 100%;
        max-width: 100%;
        line-height: 0;
        text-decoration: none;
      }

      .mobile-hero-img {
        display: block;
        width: auto;
        height: auto;
        max-width: 100vw;
        max-height: calc(100dvh - 58px);
        object-fit: contain;
        margin: 0 auto;
        user-select: none;
        -webkit-user-drag: none;
      }

      .mobile-cta-hotspot {
        position: absolute;
        top: 67%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 74%;
        height: 7.5%;
        border-radius: 50px;
        z-index: 10;
        background: transparent;
        cursor: pointer;
      }

      .mobile-footer {
        width: 100%;
        text-align: center;
        padding: 6px 12px 2px;
        font-size: 0.76rem;
        flex-shrink: 0;
        z-index: 20;
      }
    }

    /* Small mobile screens fallback (e.g. landscape phone or small SE) */
    @media (max-width: 768px) and (max-height: 560px) {
      body {
        height: auto;
        overflow-y: auto;
      }
      .mobile-view {
        height: auto;
        min-height: 100dvh;
      }
    }

    /* ==========================================================================
       3. DESKTOP / LAPTOP LANDSCAPE LAYOUT (>= 769px)
       True horizontal layout across the 16:9 monitor with panoramic scenery.
       ========================================================================== */
    @media (min-width: 769px) {
      body {
        height: 100vh;
        height: 100dvh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: #060a14 url('assets/landing-scenery.png') no-repeat center center;
        background-size: cover;
      }

      .mobile-view {
        display: none !important;
      }

      .desktop-view {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background: radial-gradient(circle at 60% 50%, rgba(6, 10, 20, 0.4) 0%, rgba(6, 10, 20, 0.85) 100%);
        padding: 20px 48px 16px;
      }

      /* Desktop Header with Logo */
      .desktop-header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }

      .desktop-logo {
        height: 48px;
        width: auto;
        object-fit: contain;
      }

      /* Main Horizontal 2-Column Stage */
      .desktop-hero-grid {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: 1.15fr 0.95fr;
        align-items: center;
        gap: 40px;
        max-width: 1380px;
        width: 100%;
        margin: 0 auto;
        padding: 10px 0;
      }

      /* Left Column: Headline, Copy & Desktop CTA */
      .desktop-content {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding-right: 20px;
      }

      .badge-tagline {
        display: inline-block;
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #e63946;
        margin-bottom: 14px;
      }

      .desktop-headline {
        font-size: clamp(2.4rem, 4vw, 3.8rem);
        font-weight: 900;
        line-height: 1.08;
        letter-spacing: -0.02em;
        text-transform: uppercase;
        margin-bottom: 18px;
        color: #ffffff;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
      }

      .desktop-headline span {
        color: #e63946;
        display: block;
      }

      .desktop-subhead {
        font-size: clamp(1.05rem, 1.4vw, 1.25rem);
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.85);
        max-width: 540px;
        margin-bottom: 30px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      }

      .desktop-cta-btn {
        display: inline-flex;
