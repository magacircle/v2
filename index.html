<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050709">
<title>MagaCircle™ — Building the Parallel Economy</title>
<meta name="description" content="MagaCircle™ — Building the Parallel Economy. What would you do with $50K? Take the quiz to see if you qualify for MagaCircle™">
<style>
:root {
  color-scheme: dark;
  --gold: #f6cd7b;
  --bg: #050709;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; background: var(--bg); }
body {
  overflow-x: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

/*
  The approved 1024×1536 artwork is the source of truth.
  The page never rebuilds its typography in CSS, so the approved proportions
  remain intact at every breakpoint.
*/
.landing {
  position: relative;
  width: 100%;
  min-height: 100svh;
  height: 100svh;
  overflow: hidden;
  isolation: isolate;
  background: var(--bg);
  display: grid;
  place-items: center;
}

/* Desktop/tablet landscape backdrop. The foreground portrait is composited
   into this asset from the exact approved mockup, not stretched. */
.landing::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background: url("assets/landing-responsive-landscape.png") center / cover no-repeat;
}

.landing::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(circle at center, transparent 42%, rgba(0,0,0,.22) 100%);
}

.mockup {
  position: relative;
  width: auto;
  height: 100%;
  max-width: none;
  max-height: none;
  aspect-ratio: 2 / 3;
  flex: 0 0 auto;
  line-height: 0;
  z-index: 1;
  box-shadow: 0 24px 80px rgba(0,0,0,.28);
}

.mockup picture,
.mockup img {
  display: block;
  width: 100%;
  height: 100%;
}

.mockup img {
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

.begin-link {
  position: absolute;
  z-index: 5;
  left: 27.6%;
  top: 49.35%;
  width: 44.8%;
  height: 6.35%;
  display: block;
  border: 0;
  border-radius: 999px;
  background: transparent;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  text-decoration: none;
  outline: none;
}

.begin-link:focus-visible {
  outline: 3px solid rgba(246,205,123,.98);
  outline-offset: 6px;
}

.begin-link:active {
  background: rgba(246,205,123,.08);
}

/*
  Portrait devices: the approved artwork fills the viewport by HEIGHT.
  This is the key fix for the old dead-space problem: the artwork is never
  width-fitted into a taller phone viewport. Its sides may crop, while the
  approved vertical composition remains exactly the same from top to bottom.
*/
@media (orientation: portrait) {
  .landing::before {
    background:
      linear-gradient(rgba(5,7,9,.48), rgba(5,7,9,.48)),
      url("assets/landing-approved-mockup.jpg") center / cover no-repeat;
    filter: blur(22px);
    transform: scale(1.06);
  }

  .mockup {
    height: 100%;
    width: auto;
    aspect-ratio: 2 / 3;
    box-shadow: none;
  }
}

/* Very narrow landscape phones: use the responsive landscape composition
   rather than shrinking the portrait into a tiny column. */
@media (orientation: landscape) and (max-width: 767px) {
  .landing::before {
    background:
      linear-gradient(rgba(5,7,9,.16), rgba(5,7,9,.16)),
      url("assets/landing-responsive-landscape.png") center / cover no-repeat;
  }

  .mockup {
    height: 100%;
    width: auto;
    aspect-ratio: 2 / 3;
    box-shadow: none;
  }
}

.site-footer {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  min-height: 42px;
  padding: 10px 14px;
  background: #050709;
  color: #77736a;
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  text-align: center;
}

.site-footer .copyright { color: #77736a; }
.site-footer a { color: #8f8c83; text-decoration: none; }
.site-footer a:hover { color: #d7bd7e; }

@media (max-width: 420px) {
  .site-footer { gap: 9px; font-size: 9px; padding-inline: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  .begin-link { transition: none; }
}
</style>
</head>
<body>
<main aria-label="MagaCircle™ landing page">
  <section class="landing">
    <div class="mockup">
      <picture>
        <img
          src="assets/landing-approved-mockup.png"
          width="1024"
          height="1536"
          alt="MagaCircle™ — Building the Parallel Economy. What would you do with $50K? Take the quiz to see if you qualify for MagaCircle™"
          draggable="false"
        >
      </picture>
      <a class="begin-link" href="quiz.html" aria-label="Let's begin the MagaCircle™ quiz" title="Let's begin"></a>
    </div>
  </section>

  <nav class="site-footer" aria-label="Site navigation">
    <span class="copyright">Copyright © 2026 MagaCircle™</span><span class="sep">•</span>
    <a href="index.html">Home</a><span class="sep">•</span>
    <a href="quiz.html">Quiz</a><span class="sep">•</span>
    <a href="privacy.html">Privacy</a><span class="sep">•</span>
    <a href="terms.html">Terms</a>
  </nav>
</main>
</body>
</html>
