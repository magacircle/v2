<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050709">
<title>MagaCircle™ — Building the Parallel Economy</title>
<meta name="description" content="MagaCircle™ — Building the Parallel Economy. What would you do with $50K? Take the quiz to see if you qualify for MagaCircle™">
<style>
:root{color-scheme:dark;--gold:#f6cd7b;--bg:#050709}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:var(--bg)}
body{overflow-x:hidden;font-family:Arial,Helvetica,sans-serif}

/*
  The approved artwork is a 2:3 composition. It is NEVER stretched or cropped.
  The viewport stage uses svh so mobile browser chrome cannot resize the artwork
  while the visitor scrolls to the footer. Any space outside the artwork is filled
  with the same artwork, softly blurred/darkened, so the desktop treatment matches
  the mobile lighting and color palette instead of introducing a different scene.
*/
.landing{
  position:relative;
  width:100%;
  height:100svh;
  min-height:320px;
  overflow:hidden;
  display:grid;
  place-items:center;
  isolation:isolate;
  background:var(--bg);
}

.landing::before{
  content:"";
  position:absolute;
  inset:-48px;
  z-index:-2;
  background:
    linear-gradient(rgba(5,7,9,.46),rgba(5,7,9,.46)),
    url("assets/landing-approved-mockup.jpg") center / cover no-repeat;
  filter:blur(24px);
  transform:scale(1.07);
}

.landing::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:radial-gradient(circle at center,transparent 30%,rgba(0,0,0,.34) 100%);
}

.mockup{
  position:relative;
  width:auto;
  height:100svh;
  max-height:1536px;
  max-width:1024px;
  aspect-ratio:2 / 3;
  flex:0 0 auto;
  line-height:0;
  overflow:visible;
  box-shadow:0 24px 80px rgba(0,0,0,.42);
}

.mockup img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

/* The visible button in the approved artwork is the clickable target. */
.begin-link{
  position:absolute;
  z-index:5;
  left:27.6%;
  top:49.35%;
  width:44.8%;
  height:6.35%;
  display:block;
  border:0;
  border-radius:999px;
  background:transparent;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  text-decoration:none;
  outline:none;
}
.begin-link:focus-visible{outline:3px solid rgba(246,205,123,.98);outline-offset:6px}
.begin-link:active{background:rgba(246,205,123,.08)}

/* Short screens: width becomes the limiting dimension, preventing any crop. */
@media (max-height:560px){
  .landing{height:100svh}
  .mockup{width:100vw;height:auto;max-height:none}
}

@media (max-width:600px){
  .mockup{box-shadow:none}
}

/* Keep the mobile composition identical on portrait tablets. */
@media (max-width:1024px) and (orientation:portrait){
  .mockup{height:100svh;width:auto;max-width:none}
}

.site-footer{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  min-height:42px;
  padding:10px 14px;
  background:#050709;
  color:#77736a;
  font-size:10px;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-align:center;
}
.site-footer .copyright{color:#77736a}
.site-footer a{color:#8f8c83;text-decoration:none}
.site-footer a:hover{color:#d7bd7e}
.site-footer .sep{color:#3b3b37}

@media (prefers-reduced-motion:reduce){.begin-link{transition:none}}
</style>
</head>
<body>
<main aria-label="MagaCircle™ landing page">
  <section class="landing">
    <div class="mockup">
      <img
        src="assets/landing-approved-mockup.png"
        width="1024"
        height="1536"
        alt="MagaCircle™ — Building the Parallel Economy. What would you do with $50K? Take the quiz to see if you qualify for MagaCircle™"
        draggable="false"
      >
      <a class="begin-link" href="quiz.html" aria-label="Let's begin the MagaCircle™ quiz" title="Let's begin"></a>
    </div>
  </section>

  <nav class="site-footer" aria-label="Site navigation">
    <span class="copyright">Copyright © 2026 MagaCircle™</span><span class="sep">•</span>
    <a href="index.html">Home</a><span class="sep">•</span>
    <a href="quiz.html">Quiz</a><span class="sep">•</span>
    <a href="privacy.html">Privacy</a><span class="sep">•</span>
    <a href="terms.html">Terms</a>
  </nav>
</main>
</body>
</html>
