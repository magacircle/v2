<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>MagaCircle™ — Building the Parallel Economy</title>
<meta name="description" content="MagaCircle™ — Building the Parallel Economy. Take the Builder Profile quiz to see if you qualify.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: #050607; }
  body { overflow-x: hidden; }
  .landing {
    min-height: 100svh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #050607;
  }
  .poster {
    position: relative;
    width: min(100%, 1024px);
    line-height: 0;
  }
  .poster img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 1024px;
  }
  .quiz-hotspot {
    position: absolute;
    left: 29.5%;
    top: 51.4%;
    width: 41%;
    height: 6.1%;
    display: block;
    border-radius: 999px;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .quiz-hotspot:focus-visible {
    outline: 2px solid rgba(210, 182, 113, .95);
    outline-offset: 5px;
  }
  @media (min-width: 1025px) {
    .landing { align-items: center; padding: 24px 0; }
    .poster { box-shadow: 0 24px 80px rgba(0,0,0,.45); }
  }
  @media (max-width: 480px) {
    .landing { align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<main class="landing">
  <section class="poster" aria-label="MagaCircle™ landing page">
    <img
      src="assets/landing-hero.png"
      alt="MagaCircle™ — Building the Parallel Economy. What would you do with $50K? Take the quiz to see if you qualify. The first circle is forming."
      width="1024"
      height="1536"
    >
    <a class="quiz-hotspot" href="quiz.html" aria-label="Let's begin the MagaCircle™ Builder Profile quiz"></a>
  </section>
</main>
</body>
</html>
