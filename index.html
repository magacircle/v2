<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MagaCircle™</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/MagaCircle_logo_transparent.png">

  <style>
    /* ==========================================================================
       1. GLOBAL RESET
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      height: 100%;
      background-color: #060a14;
    }

    body {
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      background-color: #060a14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ==========================================================================
       2. VIEWPORT WRAPPER
       ========================================================================== */
    .page-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex: 1 0 auto;
      margin: 0 auto;
    }

    /* ==========================================================================
       3. HERO STAGE & ARTWORK
       ========================================================================== */
    .hero-stage {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 auto;
      line-height: 0;
    }

    .hero-link {
      position: relative;
      display: inline-block;
      text-decoration: none;
      cursor: pointer;
      line-height: 0;
    }

    /* Base image sizing: portrait mobile phone view */
    .responsive-art {
      display: block;
      width: 100%;
      max-width: 480px; /* Natural phone width boundary */
      height: auto;
      max-height: calc(100dvh - 65px); /* Ensures image + footer fit on screen */
      object-fit: contain;
      margin: 0 auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ==========================================================================
       4. INTERACTIVE CTA HOTSPOT OVERLAY
       ========================================================================== */
    .cta-hotspot {
      position: absolute;
      top: 67%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72%;
      height: 7.2%;
      border-radius: 50px;
      z-index: 10;
      cursor: pointer;
      background: transparent;
      outline: none;
    }

    /* ==========================================================================
       5. DESKTOP / LAPTOP WIDESCREEN DISPLAY
       Switches cleanly to the true landscape asset on landscape screens >= 769px.
       ========================================================================== */
    @media (min-width: 769px) and (orientation: landscape) {
      body {
        height: 100vh;
        height: 100dvh;
        overflow-y: auto;
      }

      .page-container {
        height: 100%;
        max-width: 100%;
        justify-content: space-between;
        padding: 8px 16px 0;
      }

      .hero-stage {
        flex: 1 1 auto;
        min-height: 0;
      }

      .responsive-art {
        max-width: 96vw;
        max-height: calc(100dvh - 68px); /* Safe area: keeps circle & text in view */
        width: auto;
        height: auto;
      }

      .cta-hotspot {
        top: 66.8%;
        left: 50%;
        width: 30%;
        height: 7.5%;
      }
    }

    /* ==========================================================================
       6. CLEAN FOOTER (Quiz restored, correct 2026 copyright)
       ========================================================================== */
    .site-footer {
      width: 100%;
      text-align: center;
      padding: 10px 16px 14px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.03em;
      flex-shrink: 0;
      z-index: 20;
    }

    .footer-links {
      margin-bottom: 5px;
    }

    .footer-links a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      margin: 0 9px;
      transition: opacity 0.2s ease;
    }

    .footer-links a:hover {
      opacity: 0.75;
      text-decoration: underline;
    }

    .footer-links .sep {
      color: rgba(255, 255, 255, 0.35);
      user-select: none;
    }

    .copyright {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.74rem;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="page-container">
    <main class="hero-stage">
      <a href="quiz.html" class="hero-link" aria-label="Join MagaCircle">
        <picture>
          <!-- 1. Laptop / Desktop Landscape Artwork -->
          <source 
            media="(min-width: 769px) and (orientation: landscape)" 
            srcset="assets/landing-landscape.png">
          
          <!-- Fallback wide asset if landscape.png is missing -->
          <source 
            media="(min-width: 769px) and (orientation: landscape)" 
            srcset="assets/landing-desktop-landscape.png">

          <!-- 2. Mobile & Portrait Tablet Artwork -->
          <source 
            media="(orientation: portrait)" 
            srcset="assets/landing-hero.png">

          <!-- Default fallback -->
          <img 
            src="assets/landing-hero.png" 
            alt="MagaCircle™ - The First Circle is Forming" 
            class="responsive-art"
            loading="eager"
            onerror="this.onerror=null; this.src='assets/landing-approved-mockup.png';">
        </picture>

        <!-- CTA Tap/Click Target -->
        <span class="cta-hotspot" role="button" aria-label="Take the Quiz"></span>
      </a>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-links">
        <a href="quiz.html">Quiz</a>
        <span class="sep">&bull;</span>
        <a href="privacy.html">Privacy Policy</a>
        <span class="sep">&bull;</span>
        <a href="terms.html">Terms</a>
      </div>
      <p class="copyright">&copy; 2026 MagaCircle™</p>
    </footer>
  </div>

</body>
</html>
