<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050709">
<title>MagaCircle™ — Building the Parallel Economy</title>
<meta name="description" content="MagaCircle™ — Building the Parallel Economy. What would you do with $50K? Take the quiz to see if you qualify for MagaCircle™">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #050709;
  }
  body {
    overflow-x: hidden;
  }

  .landing {
    position: relative;
    width: 100%;
    min-height: 100dvh;
    background: #050709;
  }

  .mockup {
    position: relative;
    width: 100%;
    line-height: 0;
  }

  .mockup picture,
  .mockup img {
    display: block;
    width: 100%;
    height: auto;
  }

  .begin-link {
    position: absolute;
    display: block;
    text-decoration: none;
    border-radius: 999px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    z-index: 5;
  }

  .begin-link:focus-visible {
    outline: 3px solid rgba(246, 205, 123, .95);
    outline-offset: 5px;
  }

  /*
     MOBILE / PORTRAIT
     The approved portrait artwork is used below the desktop breakpoint.
     The CTA coordinates are tied to the artwork itself, so the hit area
     scales exactly with the visible button.
  */
  .begin-link {
    left: 28.4%;
    top: 49.75%;
    width: 43.2%;
    height: 5.75%;
  }

  /*
     DESKTOP / LAPTOP
     Use the approved landscape composition and let it grow to the full
     browser width. There is deliberately NO max-width container here.
     This is what removes the old "mobile card in the middle" effect.
  */
  @media (min-width: 769px) {
    .mockup {
      width: 100vw;
      max-width: none;
    }

    .begin-link {
      left: 29.5%;
      top: 23.75%;
      width: 41%;
      height: 8.9%;
    }
  }

  /* Extra-wide displays: keep the artwork edge-to-edge without gutters. */
  @media (min-width: 1600px) {
    .mockup {
      width: 100%;
    }
  }
</style>
</head>
<body>
<main class="landing" aria-label="MagaCircle™ landing page">
  <div class="mockup">
    <picture>
      <!-- True desktop/laptop composition: fills the viewport horizontally. -->
      <source media="(min-width: 769px)" srcset="assets/landing-landscape.png">
      <!-- Mobile/tablet portrait composition: preserves the version that tested well. -->
      <img
        src="assets/landing-approved-mockup.png"
        width="1024"
        height="1536"
        alt="MagaCircle™ — Building the Parallel Economy. What would you do with $50K? Take the quiz to see if you qualify for MagaCircle™"
      >
    </picture>

    <a
      class="begin-link"
      href="quiz.html"
      aria-label="Let's begin the MagaCircle™ quiz"
    ></a>
  </div>
</main>
</body>
</html>
