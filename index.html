<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050709">
<title>MagaCircle™ — Building the Parallel Economy</title>
<meta name="description" content="MagaCircle™ — Building the Parallel Economy. What would you do with $50K? Take the quiz to see if you qualify for MagaCircle™">
<style>
  :root {
    color-scheme: dark;
    --gold: #f6cd7b;
    --bg: #050709;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
    background: var(--bg);
  }

  body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  /*
   * The page is a full-viewport stage. The blurred copy of the artwork
   * fills any space that the 2:3 portrait artwork cannot naturally occupy.
   * This removes the hard black gutters on wide screens without stretching
   * the approved artwork.
   */
  .landing {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100svh;
    height: 100dvh;
    min-height: 320px;
    overflow: hidden;
    display: grid;
    place-items: center;
    isolation: isolate;
    background: var(--bg);
  }

  .landing::before {
    content: "";
    position: absolute;
    inset: -40px;
    z-index: -2;
    background:
      linear-gradient(rgba(5,7,9,.55), rgba(5,7,9,.55)),
      url("assets/landing-approved-mockup.jpg") center / cover no-repeat;
    filter: blur(22px);
    transform: scale(1.06);
  }

  .landing::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(circle at center, transparent 35%, rgba(0,0,0,.30) 100%),
      rgba(5,7,9,.18);
    pointer-events: none;
  }

  .mockup {
    position: relative;
    width: min(100vw, 1024px);
    height: auto;
    aspect-ratio: 2 / 3;
    flex: 0 0 auto;
    line-height: 0;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,.48);
  }

  .mockup img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /*
   * The artwork already contains the visible button. This is an invisible,
   * keyboard/touch-accessible hit target placed in the SAME coordinate system
   * as the artwork, so it scales with the image instead of drifting away.
   */
  .begin-link {
    position: absolute;
    z-index: 5;
    left: 27.6%;
    top: 49.35%;
    width: 44.8%;
    height: 6.35%;
    display: block;
    border: 0;
    border-radius: 999px;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
    outline: none;
  }

  .begin-link::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
  }

  .begin-link:focus-visible {
    outline: 3px solid rgba(246,205,123,.98);
    outline-offset: 6px;
  }

  .begin-link:active::after {
    background: rgba(246,205,123,.08);
  }

  /* Desktop / laptop: keep the approved 2:3 artwork intact. */
  @media (min-width: 1025px) {
    .mockup {
      height: min(100dvh, 1536px);
      width: auto;
      max-width: 1024px;
    }
  }

  /*
   * Portrait phones/tablets: fit the entire artwork to the viewport height.
   * The tiny amount of side crop that can occur is intentional; it prevents
   * the empty area underneath the design that occurred with width-only scaling.
   */
  @media (max-width: 1024px) and (orientation: portrait) {
    .mockup {
      width: auto;
      height: 100dvh;
      max-height: 1536px;
      max-width: none;
    }
  }

  /*
   * Very short screens: width becomes the limiting dimension so the artwork
   * never gets pushed beyond the viewport.
   */
  @media (max-height: 560px) and (max-width: 1024px) {
    .mockup {
      width: 100vw;
      height: auto;
    }
  }

  /* Reduce shadow on small screens for a cleaner edge-to-edge presentation. */
  @media (max-width: 600px) {
    .mockup {
      box-shadow: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .begin-link { transition: none; }
  }
</style>
</head>
<body>
<main class="landing" aria-label="MagaCircle™ landing page">
  <div class="mockup">
    <img
      src="assets/landing-approved-mockup.png"
      width="1024"
      height="1536"
      alt="MagaCircle™ — Building the Parallel Economy. What would you do with $50K? Take the quiz to see if you qualify for MagaCircle™"
      draggable="false"
    >
    <a
      class="begin-link"
      href="./quiz.html"
      aria-label="Let's begin the MagaCircle™ quiz"
      title="Let's begin"
    ></a>
  </div>
</main>
</body>
</html>
